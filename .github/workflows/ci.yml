name: CI
on:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-release:
    name: Verify release readiness
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - name: Install dependencies
        id: install
        run: npm ci
      - name: Capture dependency advisories
        run: |
          mkdir -p artifacts/dependency-audit
          status=0
          npm audit --json > artifacts/dependency-audit/npm-audit.json || status=$?
          echo "npm audit exit code: $status"
          if [ "$status" -ne 0 ]; then
            echo "::warning::Inspect dependency-audit. No automatic upgrades or security certification."
          fi
      - name: Run release verification
        run: npm run verify:release
      - name: Exercise actual Expo Web export
        run: |
          sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
          npm run smoke:native
      - name: Collect bundle export evidence when release validation fails
        if: ${{ !cancelled() && failure() && steps.install.outcome == 'success' }}
        run: npm run build:mobile:ios && npm run build:mobile:web
      - name: Save native UI regression artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-web-smoke
          path: artifacts/native-web-smoke
          if-no-files-found: ignore
      - name: Save dependency advisory report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit
          path: artifacts/dependency-audit
          if-no-files-found: ignore
  web-regression:
    name: Web production browser regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install CJK fonts for readable browser evidence
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Build Web and exercise real browser paths
        run: npm run build && npm run smoke:web
      - name: Save browser regression artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-smoke
          path: artifacts/web-smoke
          if-no-files-found: ignore
  source-snapshot:
    name: Read-only source handoff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Package tracked source, hashes and reversible changes
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, json, zipfile, hashlib
          root=pathlib.Path('.')
          out=root/'artifacts/source-handoff';out.mkdir(parents=True,exist_ok=True)
          sha=subprocess.check_output(['git','rev-parse','HEAD']).decode().strip()
          names=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          hashes={};excluded=[]
          with zipfile.ZipFile(out/'source.zip','w',zipfile.ZIP_DEFLATED) as z:
            for name in names:
              if not name: continue
              p=root/name
              if p.suffix.lower() in ('.ttf','.otf','.woff','.woff2','.pem','.p12','.key') or (p.name.startswith('.env') and p.name!='.env.example') or p.is_symlink():
                excluded.append(name);continue
              if p.is_file():
                b=p.read_bytes();hashes[name]=hashlib.sha256(b).hexdigest();z.writestr(name,b)
          (out/'manifest.json').write_text(json.dumps({'head':sha,'files':hashes,'excluded':excluded},indent=2))
          for base,label in [('b4cf885eae5105cb1266d82c040f8ecab7e168b9','from-original-main'),('cfbbac68a4bb56b7f2fec8019bf34c832fc9dd68','from-web-repair')]:
            # Only text patches; assets remain in source.zip. No dependency fonts or credentials.
            diff=subprocess.check_output(['git','diff','--no-ext-diff',base,'HEAD','--','.',' :!*.ttf'.strip(),':!*.otf',':!*.woff',':!*.woff2',':!.env*'])
            (out/(label+'.patch')).write_bytes(diff)
          print('Source snapshot',sha,'files',len(hashes),'excluded',excluded)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: source-handoff
          path: artifacts/source-handoff
          retention-days: 30
