name: Isolated native maintenance
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: native-maintenance-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  candidate:
    if: github.event.pull_request.head.repo.full_name == 'williamlovecs/stillmind-inner-cinema' && github.event.pull_request.head.ref == 'fix/native-integrity-deps-20260906'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      changed: ${{ steps.package.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - name: Install baseline locked dependencies
        run: npm ci
      - name: Prepare deduplicated candidate and check affected callers
        run: |
          mkdir -p "$RUNNER_TEMP/dependency-evidence"
          npm audit --json > "$RUNNER_TEMP/dependency-evidence/before-audit.json" || true
          node scripts/align-native-candidate.mjs
          (cd mobile && npx expo install --check)
      - name: Complete release checks without exceptions
        run: npm run verify:release
      - name: Web browser regression
        run: |
          sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
          npm run smoke:web
      - name: Collect advisory evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/dependency-evidence"
          npm audit --json > "$RUNNER_TEMP/dependency-evidence/after-audit.json" || true
          git diff --stat > "$RUNNER_TEMP/dependency-evidence/diff-stat.txt"
          git diff -- package.json mobile/package.json > "$RUNNER_TEMP/dependency-evidence/manifests.patch"
      - name: Package validated files with hashes
        id: package
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';import path from 'node:path';import {execFileSync} from 'node:child_process';import {createHash} from 'node:crypto';
          const allowed=['package.json','mobile/package.json','package-lock.json'];
          const changed=execFileSync('git',['diff','--name-only'],{encoding:'utf8'}).trim().split('\n').filter(Boolean);
          if(changed.some(p=>!allowed.includes(p)))throw Error('Unexpected change: '+changed.join(','));
          const dest=path.join(process.env.RUNNER_TEMP,'validated-dependencies');fs.mkdirSync(path.join(dest,'mobile'),{recursive:true});
          const manifest={head:process.env.HEAD_SHA,files:{}};
          for(const p of allowed){const bytes=fs.readFileSync(p);JSON.parse(bytes);fs.writeFileSync(path.join(dest,p),bytes);manifest.files[p]=createHash('sha256').update(bytes).digest('hex');}
          fs.writeFileSync(path.join(dest,'candidate.json'),JSON.stringify(manifest,null,2));
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`changed=${changed.length>0}\n`);
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: validated-dependencies
          path: ${{ runner.temp }}/validated-dependencies
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-dependency-evidence
          path: ${{ runner.temp }}/dependency-evidence
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maintenance-web-smoke
          path: artifacts/web-smoke
          if-no-files-found: ignore
          retention-days: 14
  commit-validated-lock:
    needs: candidate
    if: needs.candidate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # No npm install or app code executes in this write-capable job.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          name: validated-dependencies
          path: ${{ runner.temp }}/validated-dependencies
      - name: Check base SHA, hashes and allowlist; commit only this branch
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          target='fix/native-integrity-deps-20260906'
          actual=$(git ls-remote origin "refs/heads/$target" | cut -f1)
          test "$actual" = "$EXPECTED_HEAD"
          node --input-type=module <<'JS'
          import fs from 'node:fs';import path from 'node:path';import {createHash} from 'node:crypto';
          const dir=path.join(process.env.RUNNER_TEMP,'validated-dependencies');const m=JSON.parse(fs.readFileSync(path.join(dir,'candidate.json')));
          const allowed=['package.json','mobile/package.json','package-lock.json'];
          if(m.head!==process.env.EXPECTED_HEAD||JSON.stringify(Object.keys(m.files).sort())!==JSON.stringify([...allowed].sort()))throw Error('Unexpected candidate');
          for(const file of allowed){const b=fs.readFileSync(path.join(dir,file));if(createHash('sha256').update(b).digest('hex')!==m.files[file])throw Error('Hash mismatch');JSON.parse(b);fs.writeFileSync(file,b);}
          JS
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package.json mobile/package.json package-lock.json
          git commit -m 'build: align validated Expo SDK57 dependencies and lockfile'
          git push origin "HEAD:refs/heads/$target"
          echo "Validated dependency commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
