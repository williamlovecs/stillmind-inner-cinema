name: Native Web regression
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: native-web-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-session-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - run: node --check scripts/smoke-native-web.mjs
      - name: Install readable CJK fonts
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Export native Web UI and exercise sessions
        run: npm run build:mobile:web && node scripts/smoke-native-web.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-web-smoke
          path: artifacts/native-web-smoke
          if-no-files-found: ignore
